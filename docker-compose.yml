services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docintel-backend

    ports:
      - "8000:8000"

    volumes:
      - ./checkpoints/grayscale/best_model:/app/checkpoints/grayscale/best_model:ro
      - ./data/uploads:/app/data/uploads

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docintel-frontend

    ports:
      - "3000:3000"

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

    depends_on:
      - backend

    restart: unless-stopped